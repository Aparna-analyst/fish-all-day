<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fish All Day: his moves</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d9d6d0;font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2b1f17}
canvas{display:block}
#ui{position:fixed;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#ui b{font-size:16px;margin-right:8px}
button{font:600 13px/1 inherit;padding:8px 11px;border-radius:99px;border:1px solid #b9b2a6;background:#f3efe8;color:#2b1f17;cursor:pointer}
button.on{background:#ff5a36;border-color:#ff5a36;color:#fff}
#now{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(43,31,23,.85);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700}
#auto{background:#2b1f17;color:#fff;border-color:#2b1f17}
</style></head><body>
<div id="ui"><b>His moves, made by Lux3D</b><button id="auto">Play all in turn</button><button id="fixb" class="on">Fixed: hands stay outside his body</button></div>
<div id="now">Loading…</div>
<script type="module">
import * as THREE from 'three'; import { OrbitControls } from 'three/addons/controls/OrbitControls.js'; import { loadOldman } from '/src/character.js';
const WHAT = { Walk_Carry_Loop: 'walking in with his gear', Walk_Loop: 'walking', Sitting_Enter: 'sitting down', Sitting_Idle_Loop: 'sitting, waiting', Sitting_Exit: 'getting up',
  Consume: 'a sip of beer', OverhandThrow: 'casting the line', Idle_Loop: 'standing', Yes: 'thumbs up for a catch', Chest_Open: 'opening the cooler', Dance_Loop: 'a happy dance for a big one',
  Hit_Knockback: 'yanked by the fish', Swim_Idle_Loop: 'in the water', ClimbUp_1m: 'climbing back onto the jetty', Idle_Lantern_Loop: 'holding the lantern at night', Idle_No_Loop: 'it got away',
  Sitting_Talking_Loop: 'humming in his chair', Crouch_Idle_Loop: 'crouching at the grill', Fixing_Kneeling: 'fixing his line', LayToIdle: 'getting up off the ground',
  Idle_Talking_Loop: 'talking', Idle_FoldArms_Loop: 'arms folded (does not fit his belly)', Idle_Rail_Call: 'calling out for attention', Punch_Jab: 'shaking his fist',
  Hit_Head: 'bonked on the head', Death01: 'flopping flat on his back', Jump_Start: 'a jump for joy', Jump_Land: 'landing the jump', Zombie_Scratch: 'a lazy scratch',
  Spell_Simple_Shoot: 'pointing at you', Jog_Fwd_Loop: 'jogging to the shop', Walk_Formal_Loop: 'a stiffer walk', Interact: 'hand out for money', Hit_Chest: 'startled' };
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.toneMapping = THREE.ACESFilmicToneMapping;
r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color('#d9d6d0');
s.add(new THREE.HemisphereLight('#ffffff', '#8a8378', 1.5)); const k = new THREE.DirectionalLight('#fff4e6', 2.4); k.position.set(2, 5, 3); k.castShadow = true; s.add(k);
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.01, 100);
const ch = await loadOldman('/assets/oldman.glb'); const o = ch.model; const g = { animations: Object.values(ch.clips) };
const box = new THREE.Box3().setFromObject(o), size = box.getSize(new THREE.Vector3()); const sc = 1.5 / size.y; o.scale.setScalar(sc);
o.position.y = -box.min.y * sc; s.add(o);
const floor = new THREE.Mesh(new THREE.CircleGeometry(2.2, 48), new THREE.ShadowMaterial({ opacity: 0.18 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; s.add(floor);
cam.position.set(1.6, 1.3, 3.4); const ctl = new OrbitControls(cam, r.domElement); ctl.target.set(0, 0.75, 0); ctl.update();
const mixer = ch.mixer; let cur = null, auto = false, autoT = 0;
const ui = document.getElementById('ui'), now = document.getElementById('now'), btns = {};
function play(name) {
  const a = ch.play(name, { fade: 0.35 }); cur = a;
  for (const [n, b] of Object.entries(btns)) b.classList.toggle('on', n === name);
  now.textContent = `${name.replace(/_/g, ' ')}: ${WHAT[name] || ''}`;
}
for (const c of g.animations.filter(c => c.name !== 'Walk_Carry_Loop')) { const b = document.createElement('button'); b.textContent = WHAT[c.name] || c.name; b.title = c.name; b.onclick = () => { auto = false; document.getElementById('auto').classList.remove('on'); play(c.name); }; btns[c.name] = b; ui.appendChild(b); }
document.getElementById('auto').onclick = (e) => { auto = !auto; e.target.classList.toggle('on', auto); autoT = 0; if (auto) play(g.animations[0].name); };
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
document.getElementById('fixb').onclick = (e) => { ch.fix = !ch.fix; e.target.classList.toggle('on', ch.fix); e.target.textContent = ch.fix ? 'Fixed: hands stay outside his body' : 'Before: as the library made it'; };
play('Sitting_Idle_Loop'); document.getElementById('auto').click();
const clock = new THREE.Clock();
r.setAnimationLoop(() => { const dt = clock.getDelta(); ch.update(dt);
  if (auto) { autoT += dt; if (autoT > 3.2) { autoT = 0; const i = g.animations.findIndex(a => a.name === cur.getClip().name); play(g.animations.filter(c => c.name !== 'Walk_Carry_Loop')[(i + 1) % (g.animations.length - 1)]?.name || 'Walk_Loop'); } }
  r.render(s, cam); });
</script></body></html>
